name: CI

# Every push: the unit and golden tests (every comparison with the original),
# the release checks and the UCI smoke test, natively on Linux, macOS and
# Windows.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python-chess (for the UCI smoke test)
        run: python -m pip install chess

      - name: Unit and golden tests
        run: zig build test -Doptimize=ReleaseSafe

      - name: Reference checksums and UNVERIFIED tags
        run: zig build check-unverified

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: UCI smoke test
        shell: bash
        run: python tools/scripts/uci_smoke.py zig-out/bin/cyrus$([ "$RUNNER_OS" = Windows ] && echo .exe)

      # The Windows 7 build (docs/UCI.md): 64-bit and 32-bit, no import that
      # Windows 7 lacks, and the same smoke test.
      - name: Windows 7 builds
        if: runner.os == 'Windows'
        shell: bash
        run: |
          zig build -Doptimize=ReleaseSafe -Dwin7=true -Dtarget=x86_64-windows.win7 -Dcpu=baseline -p zig-out-win7-x86_64
          zig build -Doptimize=ReleaseSafe -Dwin7=true -Dtarget=x86-windows.win7 -Dcpu=baseline -p zig-out-win7-x86
          python tools/scripts/check_win7_imports.py zig-out-win7-x86_64/bin/cyrus.exe zig-out-win7-x86/bin/cyrus.exe
          python tools/scripts/uci_smoke.py zig-out-win7-x86_64/bin/cyrus.exe
          python tools/scripts/uci_smoke.py zig-out-win7-x86/bin/cyrus.exe
